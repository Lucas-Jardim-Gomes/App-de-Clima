<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home App CLima</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body >
    <button id="btn-modo-escuro" onclick="alternarModoEscuro()">Modo Escuro</button>
    <main>
        <h1 id="logo">
            <img src="img/2.png" alt=" Ícone de clima">
            <span class="tempo">Tempo</span>
            <span class="agora">Agora</span>
        </h1>
        
    

       <!-- Tela de busca para o usuário digitar o nome da cidade e buscar o clima -->
<section id="tela-home">

    <input type="text"
    id="cidade"
     placeholder="Digite o nome da sua cidade">

     <button type="button" onclick="buscarClima()">Buscar Clima</button>
</section>

    <!-- Tela de carregamento para mostrar enquanto os dados estão sendo buscados da API -->
<section id="tela-carregamento" +>
    <div class="carregando">
        <p>Buscando o clima... ☁️</p>
    </div>
</section>

    <!-- Tela de resultado para mostrar o clima da cidade buscada -->
<section id="tela-resultado" class="escondido">
     <div id="resultado"></div>
     <button id="btn-voltar" type="button" onclick="voltar()">Voltar</button>
</section>
     </main>

    
     <footer>
         <p>&copy; 2026 Lucas • TempoAgora • Projeto de estudo com API.</p>
     </footer>

    <script src="config/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
